name: Shiva CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Files
        run: |
          pwd
          ls -la
          echo "Kubernetes files:"
          ls -l deployment.yaml service.yaml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest .

      - name: Push Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Files
        run: |
          pwd
          ls -la
          ls -l deployment.yaml
          ls -l service.yaml

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Check Minikube
        run: |
          minikube status
          kubectl get nodes

      - name: Pull Docker Image
        run: |
          docker pull \
            ${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest

      - name: Load Image Into Minikube
        run: |
          minikube image load \
            ${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest

      - name: Deploy Application
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Update Image
        run: |
          kubectl set image deployment/shiva-app \
            shiva-container=${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/shiva-app \
            --timeout=120s

      - name: Check Pods
        run: |
          kubectl get pods -o wide

      - name: Check Service
        run: |
          kubectl get service shiva-service
