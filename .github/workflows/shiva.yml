name: Shiva CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ==========================================
  # JOB 1 - BUILD AND PUSH DOCKER IMAGE
  # ==========================================

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest


  # ==========================================
  # JOB 2 - DEPLOY TO MINIKUBE ON EC2
  # ==========================================

  deploy:

    needs: build-and-push

    runs-on: self-hosted

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check AWS
        run: |
          aws sts get-caller-identity

      - name: Check Docker
        run: |
          docker --version
          docker ps

      - name: Check Minikube
        run: |
          minikube status

      - name: Check Kubernetes
        run: |
          kubectl get nodes

      - name: Deploy Application
        run: |
          kubectl apply -f deployment.yaml

      - name: Deploy Service
        run: |
          kubectl apply -f service.yaml

      - name: Update Docker Image
        run: |
          kubectl set image deployment/shiva-app \
            shiva-container=${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/shiva-app --timeout=120s

      - name: Check Pods
        run: |
          kubectl get pods -o wide

      - name: Check Service
        run: |
          kubectl get service shiva-service
