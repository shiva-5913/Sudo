name: Shiva CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ==================================================
  # JOB 1 - BUILD AND PUSH DOCKER IMAGE
  # ==================================================

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest .


      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest


  # ==================================================
  # JOB 2 - DEPLOY TO MINIKUBE ON EC2
  # ==================================================

  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4


      # ==================================================
      # COPY KUBERNETES FILES TO EC2
      # ==================================================

      - name: Copy Kubernetes Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deployment.yaml,service.yaml"
          target: "/home/ubuntu/shiva"


      # ==================================================
      # SSH INTO EC2 AND DEPLOY TO MINIKUBE
      # ==================================================

      - name: Deploy Application to Minikube
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "================================"
            echo "CHECK USER"
            echo "================================"

            whoami


            echo "================================"
            echo "CHECK DOCKER"
            echo "================================"

            docker --version
            docker ps


            echo "================================"
            echo "CHECK MINIKUBE"
            echo "================================"

            minikube status


            echo "================================"
            echo "CHECK KUBERNETES"
            echo "================================"

            kubectl get nodes


            echo "================================"
            echo "CHECK FILES"
            echo "================================"

            ls -la /home/ubuntu/shiva


            echo "================================"
            echo "APPLY DEPLOYMENT"
            echo "================================"

            kubectl apply \
              -f /home/ubuntu/shiva/deployment.yaml


            echo "================================"
            echo "APPLY SERVICE"
            echo "================================"

            kubectl apply \
              -f /home/ubuntu/shiva/service.yaml


            echo "================================"
            echo "UPDATE DOCKER IMAGE"
            echo "================================"

            kubectl set image deployment/shiva-app \
              shiva-container=${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest


            echo "================================"
            echo "WAIT FOR DEPLOYMENT"
            echo "================================"

            kubectl rollout status \
              deployment/shiva-app \
              --timeout=120s


            echo "================================"
            echo "CHECK PODS"
            echo "================================"

            kubectl get pods -o wide


            echo "================================"
            echo "CHECK SERVICE"
            echo "================================"

            kubectl get service shiva-service
          
