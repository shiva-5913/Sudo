name: Shiva CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ==========================================
  # BUILD AND PUSH DOCKER IMAGE
  # ==========================================

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest


  # ==========================================
  # DEPLOY TO EC2 MINIKUBE
  # ==========================================

  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================
      # COPY KUBERNETES FILES TO EC2
      # ======================================

      - name: Copy Kubernetes Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deployment.yaml,service.yaml"
          target: "/home/ubuntu/shiva"


      # ======================================
      # CONNECT TO EC2
      # ======================================

      - name: Deploy to Minikube
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "=============================="
            echo "CHECK MINIKUBE"
            echo "=============================="

            minikube status

            echo "=============================="
            echo "CHECK KUBERNETES"
            echo "=============================="

            kubectl get nodes

            echo "=============================="
            echo "APPLY DEPLOYMENT"
            echo "=============================="

            kubectl apply \
              -f /home/ubuntu/shiva/deployment.yaml

            echo "=============================="
            echo "APPLY SERVICE"
            echo "=============================="

            kubectl apply \
              -f /home/ubuntu/shiva/service.yaml

            echo "=============================="
            echo "UPDATE IMAGE"
            echo "=============================="

            kubectl set image deployment/shiva-app \
              shiva-container=${{ secrets.DOCKERHUB_USERNAME }}/shiva:latest

            echo "=============================="
            echo "WAIT FOR DEPLOYMENT"
            echo "=============================="

            kubectl rollout status deployment/shiva-app \
              --timeout=120s

            echo "=============================="
            echo "PODS"
            echo "=============================="

            kubectl get pods -o wide

            echo "=============================="
            echo "SERVICE"
            echo "=============================="

            kubectl get service shiva-service
