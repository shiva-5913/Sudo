name: Sudoku CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Hub login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/sudoku-app:${{ github.sha }} .

      # 4. Push Docker image
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/sudoku-app:${{ github.sha }}

      # 5. Copy Kubernetes YAML files to EC2
      - name: Copy Kubernetes files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deployment.yaml,service.yaml"
          target: "/home/ubuntu/"

      # 6. Deploy to Minikube
      - name: Deploy to Minikube
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Checking Minikube..."
            minikube status

            echo "Checking Kubernetes..."
            kubectl get nodes

            echo "Applying Deployment..."
            kubectl apply -f /home/ubuntu/deployment.yaml

            echo "Applying Service..."
            kubectl apply -f /home/ubuntu/service.yaml

            echo "Updating Docker image..."
            kubectl set image deployment/sudoku-app \
              sudoku-container=${{ secrets.DOCKER_USERNAME }}/sudoku-app:${{ github.sha }}

            echo "Waiting for deployment..."
            kubectl rollout status deployment/sudoku-app --timeout=120s

            echo "Checking Pods..."
            kubectl get pods -o wide

            echo "Checking Service..."
            kubectl get service sudoku-service

            echo "Deployment completed successfully!"
