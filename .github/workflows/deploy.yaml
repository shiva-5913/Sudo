name: Java Maven Docker Kubernetes CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-test-docker-deploy:

    runs-on: self-hosted

    steps:

      # ==========================================
      # 1. CHECKOUT SOURCE CODE
      # ==========================================

      - name: Checkout Source Code
        uses: actions/checkout@v4


      # ==========================================
      # 2. CHECK JAVA
      # ==========================================

      - name: Check Java
        run: |
          java -version
          mvn -version


      # ==========================================
      # 3. MAVEN BUILD
      # ==========================================

      - name: Build Application
        run: |
          mvn clean package -DskipTests


      # ==========================================
      # 4. DOCKER LOGIN
      # ==========================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==========================================
      # 5. BUILD DOCKER IMAGE
      # ==========================================

      - name: Build Docker Image
        run: |
          docker build \
            -t kurvashivashankar/java-app:latest .


      # ==========================================
      # 6. PUSH IMAGE TO DOCKER HUB
      # ==========================================

      - name: Push Docker Image
        run: |
          docker push kurvashivashankar/java-app:latest


      # ==========================================
      # 7. CHECK MINIKUBE
      # ==========================================

      - name: Check Minikube
        run: |
          minikube status
          kubectl get nodes


      # ==========================================
      # 8. DEPLOY KUBERNETES
      # ==========================================

      - name: Deploy Application
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml


      # ==========================================
      # 9. UPDATE IMAGE
      # ==========================================

      - name: Update Application Image
        run: |
          kubectl set image deployment/java-app \
            java-app=kurvashivashankar/java-app:latest


      # ==========================================
      # 10. WAIT FOR DEPLOYMENT
      # ==========================================

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/java-app --timeout=180s


      # ==========================================
      # 11. VERIFY DEPLOYMENT
      # ==========================================

      - name: Check Kubernetes Resources
        run: |
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get services
