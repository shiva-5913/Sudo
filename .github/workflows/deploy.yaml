name: Java Maven Docker Kubernetes CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout Source Code
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ==========================================
      # 3. MAVEN BUILD
      # ==========================================

      - name: Maven Build
        run: |
          mvn clean package -DskipTests


      # ==========================================
      # 4. LOGIN TO DOCKER HUB
      # ==========================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==========================================
      # 5. BUILD DOCKER IMAGE
      # ==========================================

      - name: Build Docker Image
        run: |
          docker build \
            -t kurvashivashankar/java-app:latest .


      # ==========================================
      # 6. PUSH IMAGE TO DOCKER HUB
      # ==========================================

      - name: Push Docker Image
        run: |
          docker push kurvashivashankar/java-app:latest


  deploy-to-ec2:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout Source Code
        uses: actions/checkout@v4


      # ==========================================
      # 2. COPY KUBERNETES FILES TO EC2
      # ==========================================

      - name: Copy Kubernetes Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deployment.yaml,service.yaml"
          target: "/home/ubuntu/app"


      # ==========================================
      # 3. DEPLOY TO MINIKUBE
      # ==========================================

      - name: Deploy Application to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "================================"
            echo "Checking Docker"
            echo "================================"

            docker --version


            echo "================================"
            echo "Checking Minikube"
            echo "================================"

            minikube status


            echo "================================"
            echo "Checking Kubernetes"
            echo "================================"

            kubectl get nodes


            echo "================================"
            echo "Deploying Application"
            echo "================================"

            cd /home/ubuntu/app


            kubectl apply -f deployment.yaml

            kubectl apply -f service.yaml


            echo "================================"
            echo "Updating Docker Image"
            echo "================================"

            kubectl set image deployment/java-app \
              java-app=kurvashivashankar/java-app:latest


            echo "================================"
            echo "Waiting for Deployment"
            echo "================================"

            kubectl rollout status deployment/java-app --timeout=180s


            echo "================================"
            echo "Pods"
            echo "================================"

            kubectl get pods -o wide


            echo "================================"
            echo "Services"
            echo "================================"

            kubectl get services
